# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys the FastAPI backend only. The database is an external Supabase Postgres
# instance, not a Render-managed one: Render's free Postgres is deleted after a
# fixed window, which would take the seeded fleet with it. The frontend is a static
# Vite build deployed separately on Vercel (see frontend/vercel.json).
#
# Apply with: Render Dashboard -> New -> Blueprint -> point at this repository.

services:
  - type: web
    name: predictops-api
    runtime: python
    plan: free
    region: oregon
    healthCheckPath: /api/health

    # The model is trained during the build, against a local SQLite file rather
    # than the live database. Three reasons:
    #   1. model.joblib is deliberately gitignored — a pickle must be rebuilt from
    #      source, not trusted from a repository.
    #   2. Build output becomes the running instance's filesystem on Render, so
    #      the artefact is present at runtime without committing it.
    #   3. It removes any dependency on the database being reachable at build
    #      time, and guarantees the training set is the documented synthetic
    #      distribution rather than whatever the live database happens to hold.
    #
    # The SQLite file it builds is now KEPT rather than deleted, and is named to
    # match the application's own default (`sqlite+aiosqlite:///./predictops.db`).
    # That makes the no-DATABASE_URL case a complete deployment on its own: the
    # instance boots with the full fleet and the trained model already in place,
    # with no runtime seeding and no external database to go missing. When
    # DATABASE_URL *is* set, this file is simply unused and application data is
    # seeded into Postgres on first boot as before.
    buildCommand: |
      pip install --upgrade pip
      pip install -r backend/requirements.txt
      cd backend
      DATABASE_URL=sqlite:///./predictops.db python ../data/generate_synthetic_data.py
      DATABASE_URL=sqlite:///./predictops.db python -m app.ml.train

    # Must bind 0.0.0.0 and Render's injected $PORT. The app's own defaults are
    # loopback:8000 on purpose, so they cannot be reused here.
    startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      # OPTIONAL. Leave this UNSET for a self-contained demo: the application
      # falls back to `sqlite+aiosqlite:///./predictops.db`, which the build step
      # above has already created and seeded, so the service boots with the full
      # fleet and needs no external database at all. Writes then do not survive a
      # restart or redeploy, because Render's filesystem is ephemeral — for a
      # demo instance that is a fair trade, and it means nothing can expire
      # underneath you.
      #
      # Set it only if you want data to persist. A Supabase free project is the
      # obvious choice but comes with a real expiry risk: it is paused after a
      # period of inactivity and eventually removed, and once removed the pooler
      # answers every connection with
      #     asyncpg.exceptions.InternalServerError:
      #     (ENOTFOUND) tenant/user postgres.<ref> not found
      # which reads like a credentials problem and is not one — the project is
      # gone. That is exactly how this service failed on 2026-10-19. If you see
      # that error, check the project still exists before touching the password.
      #
      # Use the SESSION POOLER string (port 5432 on *.pooler.supabase.com), which
      # is what Supabase labels "Session pooler":
      #   postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
      #
      # The region in that hostname must be the project's own region; hitting the
      # pooler in the wrong region reports the same "tenant not found".
      #
      # Not the other two:
      #   - "Direct connection" (db.<ref>.supabase.co) resolves to IPv6 only on
      #     current free projects, and Render has no outbound IPv6, so it times out.
      #   - "Transaction pooler" (port 6543) hands a server connection to a
      #     different client between statements, which breaks asyncpg's server-side
      #     prepared statements. The app detects port 6543 and disables prepared
      #     statement caching so it still works, but session mode is simpler.
      #
      # Percent-encode the password if it contains @ : / ? # or &.
      - key: DATABASE_URL
        sync: false

      - key: ENVIRONMENT
        value: production

      # The startup guard refuses to boot a non-development environment with the
      # mutation surface open, a placeholder signing key, or shared demo accounts.
      - key: AUTH_ENABLED
        value: "true"
      - key: DEMO_MODE
        value: "false"
      - key: SECRET_KEY
        generateValue: true          # Render generates and stores this once.
      - key: DEMO_PASSWORD
        sync: false                  # Set in the dashboard; never in the repo.

      # Render terminates TLS at one proxy which appends to X-Forwarded-For.
      # Without this every visitor shares a single rate-limit bucket.
      - key: TRUSTED_PROXY_HOPS
        value: "1"

      # Snowflake Cortex reads credentials from ~/.snowflake/connections.toml,
      # which cannot exist here, so Cortex is unavailable on Render by design.
      # Gemini is the only reachable provider; pinning the value makes that
      # explicit instead of letting "auto" fail over silently.
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false                  # Set in the dashboard.

      # The exact Vercel origin. A browser preflight from any other origin is
      # answered with 400 "Disallowed CORS origin", which surfaces in the frontend
      # as "Unable to connect to PredictOps services" even though the API is
      # healthy. Scheme included, no trailing slash, no path. Comma-separate to
      # allow more than one. A wildcard is downgraded to localhost outside
      # development, so it cannot be used here.
      #
      # Vercel also issues a distinct URL per preview deployment; add those
      # explicitly if you need them to reach the API.
      - key: CORS_ALLOWED_ORIGINS
        value: https://predict-ops-six.vercel.app

      # ─── Self-registration ───────────────────────────────────────────────
      # Visitors create their own account instead of sharing the demo logins.
      # The granted role can upload datasets, and uploaded datasets are visible
      # to EVERY account on this deployment — a shared workspace, not per-tenant
      # isolation. Do not raise this past what you would hand to any visitor who
      # can reach the sign-up form.
      - key: REGISTRATION_ENABLED
        value: "true"
      - key: REGISTRATION_ROLE
        value: planner

      # Shipped as "false" deliberately, and this is the one setting here worth
      # understanding before you change it.
      #
      # Startup REFUSES to boot in a non-development environment when this is
      # true and no SMTP host is configured, because with no mail transport the
      # confirmation link is returned in the registration response — so anyone
      # can confirm an address they do not own and verification proves nothing.
      # SMTP_* below are `sync: false`, so a Blueprint deploy has no mail
      # transport until someone sets them in the dashboard. Shipping "true"
      # therefore shipped a default that could not start: the first deploy of
      # this Blueprint failed with exactly that RuntimeError.
      #
      # "false" means sign-up works with no email step and unverified addresses
      # are accepted knowingly. Understand what that grants: REGISTRATION_ROLE
      # is planner, a planner can upload datasets, and uploaded datasets are
      # visible to EVERY account on this deployment. On a public URL that is an
      # open write surface. It is an acceptable trade for a demo instance and a
      # bad one for anything real.
      #
      # To tighten it, pick one:
      #   1. Set SMTP_HOST / SMTP_FROM / SMTP_USERNAME / SMTP_PASSWORD in the
      #      dashboard and flip this back to "true". Verification then works.
      #   2. Set REGISTRATION_ENABLED=false above. No public sign-up at all;
      #      visitors use the seeded planner / technician / viewer accounts,
      #      which are created regardless of DEMO_MODE and authenticate with
      #      DEMO_PASSWORD.
      - key: REGISTRATION_REQUIRE_VERIFICATION
        value: "false"

      # Confirmation links point at the FRONTEND (the /verify page, which then
      # calls the API), not at this service. Set explicitly rather than relying
      # on the CORS_ALLOWED_ORIGINS fallback, so adding a preview origin above
      # cannot change where links are sent.
      - key: FRONTEND_BASE_URL
        value: https://predict-ops-six.vercel.app

      # Optional, dashboard only — but see the warning on
      # REGISTRATION_REQUIRE_VERIFICATION above: with SMTP_HOST unset and
      # verification required, startup refuses to boot. Without mail the
      # confirmation link comes back in the registration response, which hands
      # it to whoever submitted the address and stops verification proving
      # ownership. Configure these, or turn verification off deliberately.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

      - key: PYTHON_VERSION
        value: "3.13.1"
